server:
  port: 8080

bailian:
  api:
    base-url: https://dashscope.aliyuncs.com
    key: ${BAILIAN_API_KEY:your-api-key-here}
    storage:
      base-path: /data/bailian/storage

spring:
  web:
    resources:
      add-mappings: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
