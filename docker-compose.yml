services:
  db:
    image: mysql:8.4
    container_name: bailian-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: bailian_root_2024
      MYSQL_DATABASE: bailian
      MYSQL_USER: bailian
      MYSQL_PASSWORD: bailian_pass_2024
      TZ: Asia/Shanghai
    ports:
      - "13307:3306"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: bailian-backend
    restart: always
    environment:
      BAILIAN_API_KEY: ${BAILIAN_API_KEY}
      MYSQL_DSN: bailian:bailian_pass_2024@tcp(db:3306)/bailian?charset=utf8mb4&parseTime=true
      STORAGE_PATH: /data/storage
    ports:
      - "8080:8080"
    volumes:
      - storage_data:/data/storage
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: bailian-frontend
    restart: always
    ports:
      - "3800:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  storage_data: